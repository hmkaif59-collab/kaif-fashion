<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD MART - Online Shopping</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f5f5;
  color:#222;
}

header{
  background:#ff6b00;
  color:white;
  padding:15px;
  position:sticky;
  top:0;
  z-index:1000;
}

.top{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:25px;
  font-weight:bold;
  white-space:nowrap;
}

.search{
  flex:1;
  display:flex;
}

.search input{
  width:100%;
  padding:12px;
  border:none;
  outline:none;
  border-radius:6px 0 0 6px;
  font-size:15px;
}

.search button{
  border:none;
  background:#222;
  color:white;
  padding:0 18px;
  border-radius:0 6px 6px 0;
}

.cartBtn{
  background:white;
  color:#ff6b00;
  border:none;
  padding:11px 15px;
  border-radius:6px;
  font-weight:bold;
}

.categories{
  max-width:1200px;
  margin:15px auto;
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:5px;
}

.categories button{
  border:1px solid #ddd;
  background:white;
  padding:10px 18px;
  border-radius:20px;
  white-space:nowrap;
  cursor:pointer;
}

.categories button.active,
.categories button:hover{
  background:#ff6b00;
  color:white;
}

.hero{
  max-width:1200px;
  margin:15px auto;
  padding:35px 25px;
  border-radius:12px;
  background:linear-gradient(135deg,#ff6b00,#ff9d42);
  color:white;
}

.hero h1{
  font-size:35px;
  margin-bottom:10px;
}

.hero p{
  font-size:17px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:10px;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:20px 0;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.card{
  background:white;
  border-radius:10px;
  overflow:hidden;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.card img{
  width:100%;
  height:210px;
  object-fit:cover;
}

.cardBody{
  padding:12px;
}

.card h3{
  font-size:16px;
  margin-bottom:8px;
}

.price{
  color:#ff5500;
  font-size:19px;
  font-weight:bold;
}

.old{
  color:#999;
  text-decoration:line-through;
  font-size:13px;
  margin-left:5px;
}

.view{
  margin-top:10px;
  width:100%;
  padding:10px;
  border:none;
  background:#ff6b00;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:2000;
  padding:20px;
  overflow:auto;
}

.modalBox{
  background:white;
  max-width:600px;
  margin:30px auto;
  border-radius:12px;
  padding:20px;
  position:relative;
}

.close{
  position:absolute;
  right:15px;
  top:10px;
  font-size:28px;
  cursor:pointer;
}

.modalBox img{
  width:100%;
  max-height:400px;
  object-fit:cover;
  border-radius:10px;
}

.modalBox h2{
  margin:15px 0 8px;
}

.modalPrice{
  color:#ff5500;
  font-size:25px;
  font-weight:bold;
  margin:10px 0;
}

select,
.qty{
  width:100%;
  padding:11px;
  margin:7px 0;
  border:1px solid #ddd;
  border-radius:6px;
}

.add{
  width:100%;
  padding:13px;
  border:none;
  background:#ff6b00;
  color:white;
  border-radius:7px;
  font-size:16px;
  font-weight:bold;
  margin-top:8px;
}

.cartItem{
  display:flex;
  gap:12px;
  align-items:center;
  padding:12px 0;
  border-bottom:1px solid #ddd;
}

.cartItem img{
  width:75px;
  height:75px;
  object-fit:cover;
  border-radius:8px;
}

.remove{
  margin-left:auto;
  background:#e53935;
  color:white;
  border:none;
  padding:7px 10px;
  border-radius:5px;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin-top:20px;
  color:#ff5500;
}

.orderBtn{
  width:100%;
  padding:13px;
  background:#25d366;
  color:white;
  border:none;
  border-radius:7px;
  margin-top:15px;
  font-size:16px;
  font-weight:bold;
}

footer{
  margin-top:40px;
  background:#222;
  color:white;
  text-align:center;
  padding:30px 15px;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:650px){
  .top{
    flex-wrap:wrap;
  }

  .logo{
    width:100%;
    text-align:center;
  }

  .search{
    order:2;
    width:100%;
  }

  .cartBtn{
    position:absolute;
    right:10px;
    top:48px;
  }

  .products{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .card img{
    height:170px;
  }

  .hero h1{
    font-size:27px;
  }
}

@media(max-width:380px){
  .products{
    grid-template-columns:1fr 1fr;
  }

  .card img{
    height:145px;
  }
}
</style>
</head>

<footer>

  <br>
  <p>© 2026 WORLD MART. All Rights Reserved.</p>

<!-- PRODUCT MODAL -->

    <label>Choose Size</label>

let currentProducts = products;
let selectedProduct = null;
let cart = [];

/* SHOW PRODUCTS */

function showProducts(list){

  const box = document.getElementById("products");

  box.innerHTML="";

  if(list.length===0){
    box.innerHTML="<h3>No products found.</h3>";
    return;
  }

  list.forEach(p=>{

    box.innerHTML += `

      <div class="card" onclick="openProduct(${p.id})">

        <img src="${p.img}" alt="${p.name}">

        <div class="cardBody">

          <h3>${p.name}</h3>

          <div class="price">
            ৳${p.price}
          </div>

          <button class="view" onclick="event.stopPropagation();openProduct(${p.id})">
            View Product
          </button>

        </div>

      </div>

    `;

  });

}

/* CATEGORY */

function filterCategory(category,button){

  document.querySelectorAll(".categories button")
  .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  if(category==="All"){
    currentProducts=products;
    document.getElementById("productTitle").innerText="All Products";
  }else{

    currentProducts=products.filter(
      p=>p.category===category
    );

    document.getElementById("productTitle").innerText=
      category+" Collection";
  }

  showProducts(currentProducts);
}

/* SEARCH */

function searchProducts(){

  const text=document
    .getElementById("searchInput")
    .value
    .toLowerCase();

  const result=products.filter(p=>
    p.name.toLowerCase().includes(text) ||
    p.category.toLowerCase().includes(text)
  );

  currentProducts=result;

  document.getElementById("productTitle").innerText=
    "Search Results";

  showProducts(result);
}

document.getElementById("searchInput")
.addEventListener("keyup",function(){

  if(this.value===""){
    showProducts(products);
  }else{
    searchProducts();
  }

});

/* PRODUCT MODAL */

function openProduct(id){

  selectedProduct=
    products.find(p=>p.id===id);

  document.getElementById("modalImg").src=
    selectedProduct.img;

  document.getElementById("modalName").innerText=
    selectedProduct.name;

  document.getElementById("modalPrice").innerText=
    "৳"+selectedProduct.price;

  document.getElementById("modalDesc").innerText=
    selectedProduct.desc;

  document.getElementById("quantity").value=1;

  document.getElementById("productModal").style.display="block";
}

function closeProduct(){

  document.getElementById("productModal")
  .style.display="none";
}

/* ADD CART */

function addToCart(){

  const quantity=
    parseInt(document.getElementById("quantity").value);

  const size=
    document.getElementById("size").value;

  cart.push({

    ...selectedProduct,

    quantity:quantity,

    size:size

  });

  updateCartCount();

  closeProduct();

  alert("✅ Product added to cart!");

}

/* CART COUNT */

function updateCartCount(){

  let count=0;

  cart.forEach(item=>{
    count+=item.quantity;
  });

  document.getElementById("cartCount")
  .innerText=count;
}

/* OPEN CART */

function openCart(){

  const box=
    document.getElementById("cartItems");

  box.innerHTML="";

  if(cart.length===0){

    box.innerHTML=
      "<p style='margin-top:20px'>Your cart is empty.</p>";

  }else{

    cart.forEach((item,index)=>{

      box.innerHTML += `

        <div class="cartItem">

          <img src="${item.img}">

          <div>

            <b>${item.name}</b>

            <p>Size: ${item.size}</p>

            <p>Quantity: ${item.quantity}</p>

            <b>৳${item.price * item.quantity}</b>

          </div>

          <button
            class="remove"
            onclick="removeCart(${index})">
            Remove
          </button>

        </div>

      `;

    });

  }

  let total=0;

  cart.forEach(item=>{
    total+=item.price*item.quantity;
  });

  document.getElementById("cartTotal")
  .innerText=total;

  document.getElementById("cartModal")
  .style.display="block";
}

/* REMOVE */

function removeCart(index){

  cart.splice(index,1);

  updateCartCount();

  openCart();
}

/* CLOSE CART */

function closeCart(){

  document.getElementById("cartModal")
  .style.display="none";
}

/* ORDER */

function placeOrder(){

  if(cart.length===0){

    alert("Your cart is empty!");

    return;
  }

  alert(
    "🎉 Order system is ready!\n\n" +
    "Next step: Customer name, address, phone number and payment system will be added."
  );

}

/* CLOSE WHEN CLICK OUTSIDE */

window.onclick=function(event){

  if(event.target===
    document.getElementById("productModal")){

    closeProduct();

  }

  if(event.target===
    document.getElementById("cartModal")){

    closeCart();

  }

};

/* START */

showProducts(products);
